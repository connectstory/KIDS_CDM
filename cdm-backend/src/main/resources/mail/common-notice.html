<div
  style="margin: 0; padding: 20px 0; color: #1e2124; background-color: #ffffff"
>
  <table
    width="100%"
    border="0"
    cellspacing="0"
    cellpadding="0"
    style="
      font-family:
        &quot;Pretendard GOV&quot;,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        system-ui,
        Roboto,
        &quot;Helvetica Neue&quot;,
        &quot;Segoe UI&quot;,
        &quot;Apple SD Gothic Neo&quot;,
        &quot;Noto Sans KR&quot;,
        &quot;Malgun Gothic&quot;,
        sans-serif;
    "
  >
    <tbody>
      <tr>
        <td align="center" style="border-bottom: 1px solid #d8d8d8">
          <table
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 1200px"
          >
            <tbody>
              <tr>
                <td align="right" style="padding: 20px 30px">
                  <img
                    src="https://stg.drugsafe.or.kr/fe/img/logo.png"
                    alt="한국의약품안전관리원"
                    style="display: inline-block; width: 200px; border: 0"
                    loading="lazy"
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <tr>
        <td align="center">
          <table
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 1200px"
          >
            <tbody>
              <tr>
                <td
                  style="
                    padding: 30px 30px 20px 30px;
                    border-bottom: 1px solid #303336;
                  "
                >
                  <h1
                    style="
                      margin: 0;
                      font-size: 30px;
                      color: #1e2124;
                      letter-spacing: -0.5px;
                    "
                  >
                    {title}
                  </h1>
                </td>
              </tr>
              <tr>
                <td style="padding: 20px 30px 20px 30px">
                  <div
                    style="
                      margin: 0;
                      font-size: 18px;
                      color: #1e2124;
                      line-height: 1.6;
                    "
                  >
                    {description}
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <tr>
        <td align="center">
          <table
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 760px"
          >
            <tbody>
              <tr>
                <td style="padding: 10px 30px 40px 30px">
                  <table
                    width="100%"
                    border="0"
                    cellspacing="0"
                    cellpadding="0"
                    style="
                      border: 1px solid #d8d8d8;
                      border-radius: 8px;
                      border-collapse: separate;
                      overflow: hidden;
                    "
                  >
                    <tbody>
                      <tr>
                        <td style="padding: 0 20px">
                          <table
                            width="100%"
                            border="0"
                            cellspacing="0"
                            cellpadding="0"
                          >
                            <tbody>
                              <tr>
                                <td
                                  width="150"
                                  style="
                                    padding: 20px 0;
                                    font-size: 18px;
                                    color: #1e2124;
                                    border-bottom: 1px solid #d8d8d8;
                                  "
                                >
                                  내용
                                </td>
                                <td
                                  style="
                                    padding: 20px 0;
                                    font-size: 18px;
                                    color: #1e2124;
                                    border-bottom: 1px solid #d8d8d8;
                                  "
                                >
                                  {contentValue}
                                </td>
                              </tr>
                              <tr>
                                <td
                                  width="150"
                                  style="
                                    padding: 20px 0;
                                    font-size: 18px;
                                    color: #1e2124;
                                  "
                                >
                                  업무시스템
                                </td>
                                <td style="padding: 20px 0; font-size: 18px">
                                  통합분석시스템(CDM)
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <tr>
        <td
          align="center"
          style="border-bottom: 1px solid #eeeeee; padding-bottom: 50px"
        >
          <table
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 1200px"
          >
            <tbody>
              <tr>
                <td align="center" style="padding: 0 30px">
                  <a
                    href="{buttonUrl}"
                    target="_blank"
                    style="
                      display: inline-block;
                      max-width: 400px;
                      padding: 20px 10px;
                      background-color: #087c80;
                      color: #ffffff;
                      font-size: 18px;
                      font-weight: 700;
                      text-decoration: none;
                      border-radius: 4px;
                    "
                    rel="noreferrer noopener"
                    >{buttonText}</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <tr>
        <td align="center">
          <table
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 1200px"
          >
            <tbody>
              <tr>
                <td style="padding: 30px">
                  <div
                    style="
                      margin: 0;
                      font-size: 16px;
                      color: #1e2124;
                      line-height: 1.8;
                    "
                  >
                    본 메일은 발신전용 메일이므로 회신이 불가합니다.<br />
                    문의사항은
                    <strong>한국의약품안전관리원 02-2172-6700</strong>으로
                    문의주시기 바랍니다.
                  </div>
                  <div
                    style="
                      margin: 15px 0 0 0;
                      font-size: 16px;
                      color: #1e2124;
                      line-height: 1.6;
                    "
                  >
                    <strong
                      >(14051) 경기도 안양시 동안구 부림로 169번길 30
                      5층</strong
                    >
                  </div>
                  <div
                    style="margin: 25px 0 0 0; font-size: 15px; color: #464c53"
                  >
                    <span style="font-size: 13px; letter-spacing: 0"
                      >COPYRIGHT© Korea Institute of Drug Safety &amp; Risk
                      Management. All rights reserved.</span
                    >
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</div>
